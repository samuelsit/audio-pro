name: ha-gestion

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ha
      POSTGRES_PASSWORD: ha
      POSTGRES_DB: ha_gestion
      TZ: Europe/Paris
    ports:
      - '5433:5432' # 5433 côté hôte pour éviter un éventuel PostgreSQL local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ha -d ha_gestion']
      interval: 5s
      timeout: 3s
      retries: 10

  # Fork communautaire de MinIO : l'image officielle minio/minio n'est plus distribuée.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ha-minio
      MINIO_ROOT_PASSWORD: ha-minio-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ha-minio ha-minio-secret &&
      mc mb --ignore-existing local/ha-documents
      "
    restart: 'no'

  # E-mails de développement : rien ne sort de la machine.
  mailpit:
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  minio-data:
