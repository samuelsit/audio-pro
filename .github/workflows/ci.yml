name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ha
          POSTGRES_PASSWORD: ha
          POSTGRES_DB: ha_gestion
          TZ: Europe/Paris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ha -d ha_gestion"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_ADMIN: postgresql://ha:ha@localhost:5432/ha_gestion
      DATABASE_URL: postgresql://ha_app:ha_app@localhost:5432/ha_gestion
      # Tests d'intégration : base créée et migrée par le globalSetup de Vitest.
      DATABASE_URL_TEST: postgresql://ha:ha@localhost:5432/ha_gestion_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
